# Prueba de restauración (infraestructura.md §9), a mano desde Actions: baja la
# última copia del bucket (o la que se elija), la descifra, la restaura en una
# branch efímera de Neon, cuenta las filas por tabla y borra la branch
# (scripts/restore-test.mjs). Se corre al dar de alta el backup y después en la
# rutina mensual.

name: Prueba de restauración

on:
  workflow_dispatch:
    inputs:
      archivo:
        description: "Copia a restaurar (AAAA-MM-DD.sql.gz.gpg). Vacío: la última."
        required: false

concurrency:
  group: restore-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restore:
    name: Restaurar la copia en una branch efímera
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: ./.github/actions/pg-client

      - name: Bajar la copia
        env:
          ARCHIVO: ${{ inputs.archivo }}
        run: |
          if [ -z "$ARCHIVO" ]; then
            ARCHIVO=$(aws s3 ls "s3://$BACKUP_S3_BUCKET/backups/vx3/" --endpoint-url "$BACKUP_S3_ENDPOINT" \
              | awk '{print $4}' | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.sql\.gz\.gpg$' | sort | tail -n 1)
          fi
          if [ -z "$ARCHIVO" ]; then echo "::error::No hay copias en backups/vx3/."; exit 1; fi
          aws s3 cp "s3://$BACKUP_S3_BUCKET/backups/vx3/$ARCHIVO" backup.sql.gz.gpg \
            --endpoint-url "$BACKUP_S3_ENDPOINT" --only-show-errors
          echo "Copia: backups/vx3/$ARCHIVO" >> "$GITHUB_STEP_SUMMARY"

      - name: Descifrar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 --decrypt backup.sql.gz.gpg 3<<< "$BACKUP_PASSPHRASE" \
            | gunzip > restore.sql
          rm backup.sql.gz.gpg

      - name: Restaurar y contar
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: node scripts/restore-test.mjs restore.sql

      # Tiene datos de producción: no queda nada en el runner, aunque el job falle.
      - name: Borrar la copia del runner
        if: always()
        run: rm -f restore.sql backup.sql.gz.gpg
