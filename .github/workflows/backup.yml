# Copia externa de producción (infraestructura.md §9): todos los domingos a las
# 03:00 de Argentina, y a mano desde Actions cuando haga falta.
#
# pg_dump de main con el usuario readonly → comprimido → cifrado con gpg (AES256,
# la frase está en BACKUP_PASSPHRASE y en 1Password) → bucket de backups de la
# agencia, en backups/vx3/AAAA-MM-DD.sql.gz.gpg. La retención de 90 días es una
# regla del bucket. Para leer una copia: docs/operacion.md.

name: Backup

on:
  schedule:
    # 06:00 UTC = 03:00 en Argentina, que no tiene horario de verano.
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Copia cifrada de producción
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 no acepta las sumas de verificación que el CLI de AWS manda por defecto.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/pg-client

      - name: Copia
        env:
          DATABASE_URL_READONLY: ${{ secrets.PROD_DATABASE_URL_READONLY }}
        run: pg_dump --no-owner --no-privileges --file dump.sql "$DATABASE_URL_READONLY"

      # Un dump cortado no trae la última línea: mejor fallar que subir una copia rota.
      - name: Verificar que la copia está completa
        run: |
          tail -n 5 dump.sql | grep -q "PostgreSQL database dump complete" \
            || { echo "::error::El dump no terminó bien."; exit 1; }

      - name: Comprimir y cifrar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gzip -9 dump.sql
          gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
            --passphrase-fd 3 --output backup.sql.gz.gpg dump.sql.gz 3<<< "$BACKUP_PASSPHRASE"
          rm dump.sql.gz

      - name: Subir al bucket
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          fecha=$(TZ=America/Argentina/Buenos_Aires date +%F)
          destino="s3://$BACKUP_S3_BUCKET/backups/vx3/$fecha.sql.gz.gpg"
          aws s3 cp backup.sql.gz.gpg "$destino" --endpoint-url "$BACKUP_S3_ENDPOINT" --only-show-errors
          tamaño=$(du -h backup.sql.gz.gpg | cut -f1)
          echo "Backup subido: backups/vx3/$fecha.sql.gz.gpg ($tamaño)" >> "$GITHUB_STEP_SUMMARY"
